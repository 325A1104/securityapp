      background-image: repeating-linear-gradient(

        rgba(255, 0, 127, 0.12) 14px,
        transparent 14px,
        transparent 28px
      );
    }

    .dangan-stripes-subtle {
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(255, 255, 255, 0.025),

        transparent 16px,
        transparent 32px

    }

    }

    /* Animations */
    @keyframes shake-anim {
      0% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(-10px, 8px) rotate(-1.5deg); }
      30% { transform: translate(12px, -8px) rotate(1.5deg); }
      45% { transform: translate(-8px, -6px) rotate(-1deg); }
      60% { transform: translate(9px, 5px) rotate(1deg); }
      75% { transform: translate(-5px, 3px) rotate(-0.5deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes damage-flash-anim {
      0% { background-color: rgba(220, 38, 38, 0.7); }
      100% { background-color: transparent; }
    }

    @keyframes pulse-scale {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .animate-shake {
      animation: shake-anim 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    .animate-damage {
      animation: damage-flash-anim 0.5s ease-out;
    }

    .animate-pulse-btn {
      animation: pulse-scale 2s infinite ease-in-out;
    }

    ::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 0, 127, 0.4);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {

    }

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(13, 13, 23, 0.95);

      filter: drop-shadow(0 0 6px #ff007f);
      transition: all 0.3s;
    }

      fill: #27273a;
      filter: none;
      transform: scale(0.85);
    }

    .koto-fan-container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding: 32px 48px 16px; /* 左右に十分なパディング（48px）を確保し、画面端見切れを防止 */
      min-height: 255px;
      perspective: 1200px;
      overflow: visible; /* ホバーや回転時のはみ出しクリップを防止 */
      position: relative;
      margin: 0 auto;
      max-width: 100%;
      box-sizing: border-box;
    }

      display: flex;
      flex-direction: column;

      transform-origin: center bottom;
    }

    @media (max-width: 860px) {
      .koto-fan-container {

      }
      .koto-card {
        width: 165px;
        height: 210px;
        margin: 0 -28px;
        padding: 8px;

      .koto-fan-container {
        padding: 20px 20px 8px;
        min-height: 200px;
        transform: scale(0.92);
        transform-origin: center bottom;
      }
      .koto-card {
        width: 145px;
        height: 195px;
        margin: 0 -30px;
        padding: 7px;
      }
    }

    /* 内側デザインフレーム */
    .koto-card::before {
      content: "";
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      pointer-events: none;
      transition: border-color 0.2s;
    }

    /* ホログラフィック光彩スイープ */
    .koto-card::after {
      content: "";
      position: absolute;
      top: -100%;
      left: -60%;
      width: 220%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent 35%,
        rgba(255, 255, 255, 0.08) 45%,
        rgba(255, 0, 127, 0.18) 50%,
        rgba(255, 255, 255, 0.08) 55%,
        transparent 65%
      );
      transform: rotate(25deg);
      pointer-events: none;
      transition: transform 0.6s ease;
    }

    /* ホバー時：最前面に浮き出て、まっすぐ回転が戻り前へ飛び出す */
    .koto-card:hover {
      z-index: 50 !important;
      transform: translateY(-22px) rotate(0deg) scale(1.08) !important;
      border-color: rgba(255, 0, 127, 0.85);
      background: linear-gradient(165deg, #262640 0%, #171728 60%, #0d0d18 100%);

        0 0 35px rgba(255, 0, 127, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .koto-card:hover::after {
      transform: rotate(25deg) translateY(60%);
    }

    .koto-card:hover::before {
      border-color: rgba(255, 0, 127, 0.4);
    }

    /* 選択・装填中：上部に飛び出し固定 ＆ ネオンピンク発光グロー */
    .koto-card.active {
      z-index: 45 !important;
      transform: translateY(-26px) rotate(0deg) scale(1.08) !important;

      background: linear-gradient(165deg, #321330 0%, #1c0a1e 60%, #110613 100%);

        0 0 70px rgba(255, 0, 127, 0.45),
        inset 0 0 20px rgba(255, 0, 127, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .koto-card.active::before {

      background: #252538;
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.6;
    }

    // ==========================================
    // 2. Web Audio API 音響シンセサイザー（完全ローカル）
    // ==========================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContextClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playClick() {
        if (this.muted) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(1400, now + 0.05);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.07);
        } catch(e) {}
      }

      playBreak() {
        if (this.muted) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          // バスドラム轟音
          const sub = this.ctx.createOscillator();
          const subGain = this.ctx.createGain();
          sub.type = 'triangle';
          sub.frequency.setValueAtTime(160, now);
          sub.frequency.exponentialRampToValueAtTime(32, now + 0.7);
          subGain.gain.setValueAtTime(0.9, now);
          subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
          sub.connect(subGain);
          subGain.connect(this.ctx.destination);
          sub.start(now);
          sub.stop(now + 0.7);

          // ガラスクラッシュ
          const bufSize = this.ctx.sampleRate * 0.45;
          const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < bufSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.08));
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = buf;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(1800, now);
          const noiseGain = this.ctx.createGain();
          noiseGain.gain.setValueAtTime(0.6, now);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          noise.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(this.ctx.destination);
          noise.start(now);
          noise.stop(now + 0.45);

          // 和音
          [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(f, now + idx * 0.03);
            g.gain.setValueAtTime(0.12, now + idx * 0.03);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start(now + idx * 0.03);
            osc.stop(now + 0.6);
          });
        } catch(e) {}
      }

      playDamage() {
        if (this.muted) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc1.type = 'sawtooth';
          osc2.type = 'sawtooth';
          osc1.frequency.setValueAtTime(150, now);
          osc2.frequency.setValueAtTime(215, now);
          gain.gain.setValueAtTime(0.45, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(this.ctx.destination);
          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.4);
          osc2.stop(now + 0.4);
        } catch(e) {}
      }
    }

    // 配列の完全シャッフル（Fisher-Yates アルゴリズム）
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
      }
      return copy;
    }

    // 指定されたシナリオに基づき、そのカテゴリの言弾（正解1枚 ＋ ダミー3〜4枚）をランダム抽出＆シャッフル
    function filterKotodamaForScenario(scenario) {
      const chapterId = scenario.chapterId;
      const pool = ALL_KOTODAMA.filter(k => k.chapterId === chapterId);
      
      // 正解カード
      const correctCard = pool.find(k => k.id === scenario.correctKotodamaId);
      // ダミーカード候補
      const dummyCandidates = pool.filter(k => k.id !== scenario.correctKotodamaId);

      // ダミー候補をランダムシャッフルして3〜4枚選出
      const shuffledDummies = shuffleArray(dummyCandidates);
      const selectedDummies = shuffledDummies.slice(0, 3 + Math.floor(Math.random() * 2)); // 3または4枚
      const combined = [correctCard, ...selectedDummies];

      // 画面上の選択肢の並び順も完全にランダム化
      return shuffleArray(combined);
    }

                  <p style="font-size: 0.75rem; color: #94a3b8;">${chap.description}</p>
                </div>
                <span class="font-mono" style="font-size: 0.7rem; background: #1a1a2e; color: #cbd5e1; padding: 4px 8px; border-radius: 4px;">
                  言弾: ${chapKotodama.length}発 / シナリオ: ${chapScenarios.length}件
                </span>
              </div>

              <!-- 収録シナリオ -->
              <div style="margin-bottom: 12px;">
                <div class="font-mono" style="font-size: 0.7rem; color: #fde047; font-weight: bold; margin-bottom: 6px;">
                  【この章の裁判シナリオ】
                </div>
                ${scenariosHtml}
              </div>

              <!-- 章の言弾一覧 -->
              <div>
                <div class="font-mono" style="font-size: 0.7rem; color: #f472b6; font-weight: bold; margin-bottom: 6px;">
                  【この章の言弾シリンダー（選択肢）】
                </div>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px;">
                  ${kotodamaListHtml}
                </div>
              </div>
            </div>
          `;
        }).join('');

        app.innerHTML = `
          <header class="top-bar">
            <div style="display: flex; align-items: center; gap: 12px;">
              <button onclick="sound.playClick(); setView('TITLE');" style="background: #1a1a28; border: 1px solid #333348; color: #cbd5e1; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-weight: bold;">
                ◀ タイトルへ戻る
              </button>
              <div>
                <h2 class="font-dela" style="font-size: 1rem; color: #fff;">言弾図鑑（人的セキュリティ対策70選）</h2>
                <div class="font-mono" style="font-size: 0.65rem; color: #94a3b8;">章別分類アーカイブ（全4章・全35事件収録）</div>
              </div>
            </div>
            <button onclick="startRandomTrial()" class="btn-ronpa" style="padding: 6px 16px; font-size: 0.85rem;">
              <span>⚡ ランダム裁判</span>
            </button>
          </header>

          <main style="max-width: 900px; margin: 0 auto; width: 100%; padding: 20px;">
            ${chaptersList}
          </main>
        `;
        return;
      }
    }

    // 初回初期化
    document.addEventListener('DOMContentLoaded', () => {
      render();
    });

    // 直ちに描画
    render();
  </script>
</body>
</html>
